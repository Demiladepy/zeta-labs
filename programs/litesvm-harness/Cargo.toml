[package]
name = "litesvm-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LiteSVM BPF harness for Zeta Policy Registry + Credit Vault"

[dev-dependencies]
zeta-interface.workspace = true
litesvm = "0.16"
solana-address = "2.6"
solana-clock = "3"
solana-hash = "4"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-sdk-ids = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["verify"] }
